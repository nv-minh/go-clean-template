# Base manifests. Overlay per environment (staging/production) with `kustomize edit set image`
# and patches for replicas, resources and config. Apply: kubectl apply -k deploy/k8s
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: orders
resources:
  - namespace.yaml
  - configmap.yaml
  - api.yaml
  - worker.yaml
images:
  - name: ghcr.io/yourorg/go-clean-template-api
    newTag: latest
  - name: ghcr.io/yourorg/go-clean-template-worker
    newTag: latest
