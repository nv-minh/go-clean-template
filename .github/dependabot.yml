version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: {interval: weekly}
    groups:
      opentelemetry:
        patterns: ["go.opentelemetry.io/*"]
      testcontainers:
        patterns: ["github.com/testcontainers/*"]
  - package-ecosystem: docker
    directory: /deploy
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
